name: "DiligentGraphics: Build Java Binding Tests"
description: "Build generic JNI marshalling tests using the toolchain from setup-java-bindings"

inputs:
  source-dir:
    description: DiligentFX source directory, relative to the workflow workspace or absolute
    default: DiligentFX
  build-dir:
    description: Build directory for generic Java marshalling tests
    default: ${{ runner.temp }}/binding-java
  configuration:
    description: Build configuration; use the same configuration for the main build
    default: Debug
  cc:
    description: C compiler for the generic fixtures
    default: clang-22
  cxx:
    description: C++ compiler for the generic fixtures
    default: clang++-22

runs:
  using: composite
  steps:
    - name: Build Java binding tests
      working-directory: ${{github.workspace}}
      shell: bash
      env:
        INPUT_SOURCE_DIR: ${{inputs.source-dir}}
        INPUT_BUILD_DIR: ${{inputs.build-dir}}
        INPUT_CONFIGURATION: ${{inputs.configuration}}
        CC: ${{inputs.cc}}
        CXX: ${{inputs.cxx}}
      run: bash "${{github.action_path}}/build_java_binding_tests.sh"
